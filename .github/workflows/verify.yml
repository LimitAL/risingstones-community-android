name: Verify Android project

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: risingstones-android-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Check public repository boundary
        run: |
          bash scripts/verify-repository-layout.sh
          bash scripts/check-public-boundary.sh

      - name: Verify standalone project
        run: |
          ./gradlew --no-daemon \
            testDebugUnitTest \
            lintDebug \
            assembleDebug \
            verifyReleaseManifestSecurity \
            publishPublicLibrariesToLocalRepository

      - name: Verify reusable publications
        run: |
          bash scripts/verify-local-publications.sh
          bash scripts/verify-maven-api-consumption.sh
